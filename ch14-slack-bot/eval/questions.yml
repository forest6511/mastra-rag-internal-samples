# 最終評価用の質問（18問）
# 正解の根拠は seed/world.yml だけ。world.yml に無い事実は正解に入れない。
# 内訳: UC2 障害の振り返り 3 / UC9 セキュリティチェックシート 3 / 答えてはいけない 8 / 一般 4
# groups は質問者が見られる権限グループ（all/dev/sales/mgmt/hr）。sre は開発部内なので dev。

# ── UC2: 障害の振り返り ──────────────────────────────

- id: Q01
  usecase: UC2
  asker: kobayashi
  groups: [all, dev]
  question: "明日の振り返り会用に、9/15の決済が落ちた件の下書き作ってほしい。検知から顧客への連絡まで時系列で、再発防止も入れて"
  must:
    - "日付は 2026-09-15"
    - "検知: 10:02 に監視アラートで検知（佐藤）"
    - "原因: クレペイ接続のタイムアウトが 3000ms に誤って設定されていた（9/1 の本番切替時の設定ミス。既定は 30000ms）"
    - "影響: 美容室 132 店舗・予約 418 件で決済が失敗"
    - "暫定対応: 10:40 に決済GW を旧GW のペイリンクに戻した"
    - "恒久対応: 9/18 にタイムアウトを 30000ms に直す PR #14 をマージし、クレペイに戻した"
    - "再発防止: 設定値の自動テストを追加する課題と、決済GW 応答時間の監視"
    - "決済GW 応答時間の監視は 8/20 の予約確定メール遅延（E2）の再発防止として起票済みだったが、未着手のまま今回の障害が起きた"
    - "顧客連絡: 11:30 に影響店舗へメール。セキュリティ方針 v2 の『重大障害は1時間以内にメール』に間に合わなかった（10:02 検知から約1時間28分）"
  must_not:
    - "タイムアウトの原因値を 30000ms と書く（30000ms は正しい既定値で、誤設定は 3000ms）"
    - "E2 の監視追加課題が実施済みと書く"
    - "顧客連絡が期限内だったと書く"
    - "影響件数を E2 の約40件と混同する"
  expected_behavior: answer
  sources:
    - { event: E4, where: "slack: #incident の障害スレッド" }
    - { event: E4, where: "jira: インシデント課題とコメント" }
    - { event: E4, where: "github: PR #14 とレビュー" }
    - { event: E2, where: "notion: E2 の振り返り" }
    - { event: E2, where: "jira: 監視追加の課題（未着手のまま）" }
    - { event: E3, where: "confluence: セキュリティ方針（v2）" }

- id: Q02
  usecase: UC2
  asker: sato
  groups: [all, dev]
  question: "8月にメールが遅れたときの対策って、結局やったんでしたっけ？今回の決済のやつと関係ありそうで"
  must:
    - "8/20 の予約確定メール遅延の再発防止として『決済GW の応答時間の監視を追加する』課題が起票された"
    - "その課題は未着手のまま"
    - "原因は決済GW 応答待ちの詰まりで、影響は約40件"
    - "9/15 の決済エラーの再発防止にも同じ監視の実施が入っている"
  must_not:
    - "監視が追加済み・実施済みと書く"
    - "8/20 の影響件数を 418 件や 132 店舗と書く"
  expected_behavior: answer
  sources:
    - { event: E2, where: "notion: E2 の振り返り" }
    - { event: E2, where: "jira: 監視追加の課題（未着手のまま）" }
    - { event: E4, where: "jira: インシデント課題とコメント" }

- id: Q03
  usecase: UC2
  asker: takahashi
  groups: [all, dev]
  question: "9月の決済エラー、結局なにが原因でどう直したんだっけ？PRどれ？"
  must:
    - "クレペイ接続のタイムアウトが 3000ms に誤って設定されていた（9/1 の本番切替時の設定ミス）"
    - "本来は既定の 30000ms を使う決定だった（8/5 の決定）"
    - "9/18 に PR #14 でタイムアウトを 30000ms に直してマージし、クレペイに戻した"
    - "それまでの暫定対応として 9/15 10:40 にペイリンクへ戻していた"
  must_not:
    - "原因をクレペイ側の障害と書く"
    - "PR 番号を #14 以外にする"
  expected_behavior: answer
  sources:
    - { event: E4, where: "github: PR #14 とレビュー" }
    - { event: E4, where: "slack: #incident の障害スレッド" }
    - { event: E1, where: "slack: #dev の議論（小林・田中・高橋）" }

# ── UC9: 営業のセキュリティチェックシート ────────────────

- id: Q04
  usecase: UC9
  asker: nakamura
  groups: [all, sales]
  question: |
    お客さんからセキュリティのチェックシートが来ました。下の10問に答える案を作ってもらえますか？
    1. 保存しているデータは暗号化していますか？方式は？
    2. 通信は暗号化されていますか？
    3. ログはどのくらいの期間保管していますか？
    4. データはどこに保存されていますか？
    5. バックアップの頻度と保持期間は？
    6. 障害が起きたとき、どのように・いつまでに連絡してもらえますか？
    7. 監査ログを出力（エクスポート）できますか？
    8. 社員やスタッフごとの権限管理はできますか？
    9. ISO27001 などの第三者認証は取っていますか？
    10. 外部の脆弱性診断は定期的に受けていますか？
  must:
    - "1: 保存データは AES-256 で暗号化（セキュリティ方針 v2・2026-09-01 改定）"
    - "2: 通信は TLS1.2 以上（方針 v1 の記載。v2 で変更したという記載は無い旨を添える）"
    - "3: ログ保管は3年（v2 で1年から延長）"
    - "4: データの保存場所は東京リージョン"
    - "5: バックアップは毎日・7日分保持"
    - "6: 重大障害は1時間以内にメールで連絡"
    - "7: 監査ログのエクスポートは現時点では未提供。2026-12 リリース予定"
    - "8: 権限管理は機能一覧に記載があるが、具体的な内容は資料から確認できる範囲で答え、無い部分は確認が必要と書く"
    - "9・10: 資料に記載が無いため回答できない（情シス・セキュリティ担当の加藤さんへの確認を促す）"
  must_not:
    - "ログ保管を1年と書く（Notion の機能一覧の転記ミス。正しくは v2 の3年）"
    - "暗号化を AES-128 と書く（v1 の古い値）"
    - "障害連絡を『速やかに』と書く（v1 の古い表現）"
    - "監査ログのエクスポートが今すぐ使えると書く"
    - "ISO27001 取得済み・定期診断ありなど、資料に無い事実を書く"
    - "権限管理の具体的な仕様を推測で書く"
  expected_behavior: answer
  sources:
    - { event: E3, where: "confluence: セキュリティ方針（v2）" }
    - { event: E0, where: "confluence: セキュリティ方針（v1）" }
    - { event: E6, where: "notion: 機能一覧" }
    - { event: E5, where: "jira: ロードマップのエピック" }
    - { event: E5, where: "slack: #sales で山本が顧客要望を共有" }

- id: Q05
  usecase: UC9
  asker: nakamura
  groups: [all, sales]
  question: "商談先にログって何年残してるか聞かれたんですけど、1年で合ってますか？Notionで見た気がして"
  must:
    - "ログ保管は3年（セキュリティ方針 v2・2026-09-01 に1年から延長）"
    - "Notion の機能一覧の『1年』は古い v1 の値の転記ミス"
  must_not:
    - "1年で合っていると答える"
  expected_behavior: answer
  sources:
    - { event: E3, where: "confluence: セキュリティ方針（v2）" }
    - { event: E6, where: "notion: 機能一覧" }
    - { event: E0, where: "confluence: セキュリティ方針（v1）" }

- id: Q06
  usecase: UC9
  asker: nakamura
  groups: [all, sales]
  question: "監査ログをCSVとかで出してほしいって言われてます。今できますか？できないならいつごろ？"
  must:
    - "監査ログのエクスポートは現時点では未提供"
    - "2026-12 リリース予定（2026-09-25 にロードマップに追加）"
    - "担当は高橋"
  must_not:
    - "今すぐ使えると答える"
    - "CSV など出力形式を資料に無いのに断定する"
  expected_behavior: answer
  sources:
    - { event: E5, where: "jira: ロードマップのエピック" }
    - { event: E5, where: "slack: #sales で山本が顧客要望を共有" }

# ── 答えてはいけない: 資料が無い ──────────────────────

