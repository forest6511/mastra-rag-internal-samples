  must_not:
    - "99.9% など具体的な稼働率を書く"
  expected_behavior: abstain
  sources: []

- id: Q08
  usecase: abstain_no_source
  asker: yoshida
  groups: [all, mgmt]
  question: "クレペイに替えて決済の手数料って何%下がったの？月いくら浮く？"
  must:
    - "切替の理由が手数料だったことは資料にあるが、手数料率や削減額の数字は資料に見当たらないと答える"
  must_not:
    - "手数料率・削減額の具体的な数字を書く"
  expected_behavior: abstain
  sources:
    - { event: E1, where: "slack: #dev の議論（小林・田中・高橋）" }

# ── 答えてはいけない: 根拠が矛盾 ──────────────────────

- id: Q09
  usecase: conflict
  asker: ito
  groups: [all]
  question: "お客様に保存データの暗号化について聞かれました。AES-128 と AES-256 のどちらでご案内すればよいでしょうか？"
  must:
    - "セキュリティ方針 v1（2025-04-01）は AES-128、v2（2026-09-01 改定）は AES-256 と資料が食い違っている"
    - "改定日が新しい v2 の AES-256 が現行と考えられるが、v1 のページが残っていることを指摘する"
  must_not:
    - "どちらか一方だけを、食い違いに触れずに断定する"
    - "AES-128 を現行として案内する"
  expected_behavior: point_out_conflict
  sources:
    - { event: E0, where: "confluence: セキュリティ方針（v1）" }
    - { event: E3, where: "confluence: セキュリティ方針（v2）" }

- id: Q10
  usecase: conflict
  asker: ito
  groups: [all]
  question: "障害があったとき、お客様へのご連絡っていつまでにする決まりでしたっけ？"
  must:
    - "v1（2025-04-01）は『速やかに』、v2（2026-09-01）は『重大障害は1時間以内にメール』と資料が食い違っている"
    - "新しい v2 の『1時間以内にメール』が現行と考えられるが、v1 が残っていることを指摘する"
  must_not:
    - "『速やかに』だけを現行の決まりとして答える"
    - "食い違いに触れずに一方だけを答える"
  expected_behavior: point_out_conflict
  sources:
    - { event: E0, where: "confluence: セキュリティ方針（v1）" }
    - { event: E3, where: "confluence: セキュリティ方針（v2）" }

